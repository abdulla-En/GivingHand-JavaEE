$kind: http-request
name: Create Donation
description: |-
  Commits a new donation to a campaign item. Requires Donor role.
  The request must include a valid session cookie (JSESSIONID).
method: POST
url: '{{baseUrl}}/api/donations'
order: 1777103267330
headers:
  - key: Cookie
    value: 'JSESSIONID={{token}}'
    description: Session cookie for authentication (Donor role required)
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "campaignItemId": 1,
      "quantity": 10
    }
