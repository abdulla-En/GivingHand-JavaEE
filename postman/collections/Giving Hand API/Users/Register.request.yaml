$kind: http-request
name: Register
method: POST
url: '{{baseUrl}}/api/user/register'
order: 1000
description: |-
  Registers a new user. No authentication required.

  - `role` can be `"Donor"` or `"Organization"`.
  - Password must be 8-20 characters with at least one digit, one uppercase letter, one lowercase letter, one special character, and no whitespace.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "John Doe",
      "email": "john.doe@example.com",
      "password": "Password@123",
      "birthDate": "1990-01-15",
      "bio": "A passionate donor",
      "role": "Donor"
    }
