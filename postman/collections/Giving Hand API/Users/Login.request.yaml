$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/api/user/login'
order: 2000
description: |-
  Logs in an existing user using Basic Auth credentials.
  Requires Basic Auth credentials (email and password).

  - On success, returns a welcome message with the user's name and a session `token`.
  - The `token` is a session ID that can be used for subsequent authenticated requests.
  - Available to all users .
auth:
  type: basic
  credentials:
    - key: username
      value: '{{email}}'
    - key: password
      value: '{{password}}'
